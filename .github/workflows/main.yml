name: Daily Weather Line Notification

on:
  workflow_dispatch:
  schedule:
    - cron: '25 21 * * *'  # 鬧鐘 2：台灣 05:25

jobs:
  run-weather-script:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安裝網路請求套件
        run: pip install requests urllib3

      - name: 執行天氣通知
        env:
          # 🚨 重點：在這裡把 GitHub Secrets 對接到 Python 的 os.environ 中
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: python main.py
